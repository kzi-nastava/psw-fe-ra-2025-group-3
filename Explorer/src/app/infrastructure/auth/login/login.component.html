<form [formGroup]="loginForm" (ngSubmit)="login()">
    <div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to continue your journey</p>

        <mat-form-field>
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" type="text"/>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Password</mat-label>
            <input matInput formControlName="password" type="password"/>
        </mat-form-field>
        <button color="primary" type="submit" mat-raised-button>Login</button>


        <button type="button" class="google-btn" (click)="googleSignIn()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            <span>Sign in with Google</span>
        </button>
        <div id="google-hidden-btn" style="position: absolute; opacity: 0; pointer-events: none;"></div>

        <p>Don't have an account yet?<a href="/register">Sign Up</a></p>
    </div>
</form>
