<div id="tourist-equipment">
  <h2>Moja Oprema</h2>
  <hr>
  
  <!-- Notifikacije -->
  <div *ngIf="successMessage" class="notification success">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="notification error">
    {{ errorMessage }}
  </div>
  
  <!-- Brojač -->
  <div class="equipment-counter">
    <p>Posedujete {{ ownedEquipmentCount }} stavki opreme</p>
  </div>
  
  <!-- Tabovi -->
  <mat-tab-group [(selectedIndex)]="selectedTabIndex">
    
    <!-- Tab: Sva oprema -->
    <mat-tab label="Sva oprema">
      <div class="equipment-list">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Naziv</th>
              <th>Opis</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let eq of allEquipment" 
                [class.owned-equipment]="eq.isOwnedByTourist">
              <td>
                <mat-checkbox 
                  [checked]="eq.isOwnedByTourist"
                  (change)="onCheckboxChange(eq, $event)">
                </mat-checkbox>
              </td>
              <td>{{ eq.name }}</td>
              <td>{{ eq.description }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </mat-tab>
    
    <!-- Tab: Moja oprema -->
    <mat-tab label="Moja oprema">
      <div class="equipment-list">
        <div *ngIf="myEquipment.length === 0" class="empty-message">
          <p>Nemate evidentirane opreme</p>
        </div>
        <table *ngIf="myEquipment.length > 0">
          <thead>
            <tr>
              <th>Naziv</th>
              <th>Opis</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let eq of myEquipment">
              <td>{{ eq.name }}</td>
              <td>{{ eq.description }}</td>
              <td>
                <button 
                  color="warn" 
                  (click)="onRemoveFromMyEquipment(eq.id)" 
                  mat-raised-button>
                  Ukloni
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </mat-tab>
    
  </mat-tab-group>
</div>
