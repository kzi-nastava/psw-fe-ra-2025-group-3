<div class="notification-dropdown">
  <div class="dropdown-header">
    <h3>Notifications</h3>
    <button 
      mat-button 
      class="mark-all-btn" 
      (click)="markAllAsRead()"
      [disabled]="notifications.length === 0 || isAllRead()">
      Mark all as read
    </button>
  </div>

  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div *ngIf="!isLoading && notifications.length === 0" class="empty-state">
    <mat-icon class="empty-icon">notifications_none</mat-icon>
    <p>You have no notifications.</p>
  </div>

  <div *ngIf="!isLoading && notifications.length > 0" class="notification-list">
    <xp-notification-item 
      *ngFor="let notification of notifications"
      [notification]="notification"
      (notificationClicked)="onNotificationClick()">
    </xp-notification-item>
  </div>
</div>
