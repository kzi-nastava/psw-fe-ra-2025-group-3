<div 
  class="ac-reward-notification" 
  [class.unread]="!notification.isRead"
  [class.animated]="showAnimation">
  
  <button class="close-button" (click)="onClose()" type="button">
    <mat-icon>close</mat-icon>
  </button>
  
  <div class="reward-header" (click)="onClick()">
    <div class="reward-icon-container">
      <div class="reward-icon">
        <mat-icon>stars</mat-icon>
      </div>
      <div class="sparkle sparkle-1">✨</div>
      <div class="sparkle sparkle-2">✨</div>
      <div class="sparkle sparkle-3">✨</div>
    </div>
    
    <div class="reward-title">
      <h3>You've earned AC rewards!</h3>
      <span class="notification-time">{{ getRelativeTime() }}</span>
    </div>
  </div>

  <div class="reward-content" (click)="onClick()">
    <div class="total-ac-display" *ngIf="totalAc > 0">
      <span class="ac-amount">{{ totalAc }}</span>
      <span class="ac-label">AC</span>
    </div>
    <div class="total-ac-display" *ngIf="totalAc === 0">
      <span class="ac-amount">0</span>
      <span class="ac-label">AC</span>
      <div style="font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 4px;">
        Parsing in progress...
      </div>
    </div>

    <div class="reward-breakdown" *ngIf="baseReward > 0 || fastCompletionBonus > 0 || streakBonus > 0">
      <div class="reward-item" *ngIf="baseReward > 0">
        <mat-icon class="reward-item-icon">check_circle</mat-icon>
        <span class="reward-item-text">Base reward</span>
        <span class="reward-item-amount">+{{ baseReward }} AC</span>
      </div>

      <div class="reward-item bonus" *ngIf="fastCompletionBonus > 0">
        <mat-icon class="reward-item-icon">flash_on</mat-icon>
        <span class="reward-item-text">Fast completion bonus</span>
        <span class="reward-item-amount">+{{ fastCompletionBonus }} AC</span>
      </div>

      <div class="reward-item streak" *ngIf="streakBonus > 0">
        <mat-icon class="reward-item-icon">local_fire_department</mat-icon>
        <span class="reward-item-text">Streak bonus</span>
        <span class="reward-item-amount">+{{ streakBonus }} AC</span>
      </div>
    </div>
    
    <!-- Fallback: prikaži originalnu poruku ako parsiranje ne uspe -->
    <div class="reward-breakdown" *ngIf="totalAc === 0 && baseReward === 0 && fastCompletionBonus === 0 && streakBonus === 0">
      <div class="reward-item" style="border-left-color: rgba(255,255,255,0.3);">
        <span class="reward-item-text" style="font-size: 12px; color: rgba(255,255,255,0.8);">
          {{ notification.message }}
        </span>
      </div>
    </div>
  </div>

  <div *ngIf="!notification.isRead" class="unread-indicator">
    <div class="pulse-dot"></div>
  </div>
</div>
