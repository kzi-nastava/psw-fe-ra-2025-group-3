<mat-toolbar class="explorer-navbar">
  <div class="navbar-container">
    <div class="navbar-left">
      <!-- Logo -->
      <a routerLink="/home" class="navbar-brand">
        <img src="assets/images/travel-vista-logo.svg" alt="Travel Vista" class="brand-logo">
        <div class="brand-text-container">
          <span class="brand-text-main">TRAVEL</span>
          <span class="brand-text-sub">VISTA</span>
        </div>
      </a>

      <!-- Navigation Buttons -->
      <div class="navbar-buttons">

      <!-- Administrator Dropdowns -->
      <ng-container *ngIf="user && user.role === 'administrator'">
        <!-- Dropdown: Users -->
        <button mat-button [matMenuTriggerFor]="adminUsersMenu" class="nav-menu-button">
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
          <span>Users</span>
          <mat-icon>group</mat-icon>
        </button>
        <mat-menu #adminUsersMenu="matMenu" class="custom-menu">
          <button mat-menu-item routerLink="/administration/profiles">
            <mat-icon>person</mat-icon>
            <span>My Profiles</span>
          </button>
          <button mat-menu-item routerLink="/administration/tourists">
            <mat-icon>group</mat-icon>
            <span>Tourists</span>
          </button>
        </mat-menu>

        <!-- Dropdown: Content -->
        <button mat-button [matMenuTriggerFor]="adminContentMenu" class="nav-menu-button">
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
          <span>Content</span>
          <mat-icon>inventory</mat-icon>
        </button>
        <mat-menu #adminContentMenu="matMenu" class="custom-menu">
          <button mat-menu-item routerLink="/equipment">
            <mat-icon>backpack</mat-icon>
            <span>Equipment</span>
          </button>
          <button mat-menu-item routerLink="/administration/facilities">
            <mat-icon>business</mat-icon>
            <span>Facilities</span>
          </button>
          <button mat-menu-item routerLink="/administration/encounters">
            <mat-icon>explore</mat-icon>
            <span>Encounters</span>
          </button>
          <button mat-menu-item routerLink="/administration/monuments">
            <mat-icon>castle</mat-icon>
            <span>Monuments</span>
          </button>
        </mat-menu>

        <!-- Dropdown: Management -->
        <button mat-button [matMenuTriggerFor]="adminManagementMenu" class="nav-menu-button">
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
          <span>Management</span>
          <mat-icon>settings</mat-icon>
        </button>
        <mat-menu #adminManagementMenu="matMenu" class="custom-menu">
          <button mat-menu-item routerLink="/administration/award-events">
            <mat-icon>emoji_events</mat-icon>
            <span>Awards</span>
          </button>
          <button mat-menu-item routerLink="/administration/tour-problems">
            <mat-icon>report_problem</mat-icon>
            <span>Tour Problems</span>
          </button>
          <button mat-menu-item routerLink="/app-ratings">
            <mat-icon>star_rate</mat-icon>
            <span>App Ratings</span>
          </button>
        </mat-menu>
      </ng-container>

      <!-- Author Dropdowns -->
      <ng-container *ngIf="user && user.role === 'author'">
        <!-- Dropdown: My Content -->
        <button mat-button [matMenuTriggerFor]="authorContentMenu" class="nav-menu-button">
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
          <span>My Content</span>
          <mat-icon>edit_note</mat-icon>
        </button>
        <mat-menu #authorContentMenu="matMenu" class="custom-menu">
          <button mat-menu-item routerLink="/author/tours">
            <mat-icon>map</mat-icon>
            <span>My Tours</span>
          </button>
          <button mat-menu-item routerLink="/author/bundles">
            <mat-icon>inventory</mat-icon>
            <span>My Bundles</span>
          </button>
          <button mat-menu-item routerLink="/author/coupons">
            <mat-icon>local_offer</mat-icon>
            <span>My Coupons</span>
          </button>
          <button mat-menu-item routerLink="/author/sales">
            <mat-icon>sell</mat-icon>
            <span>My Sales</span>
          </button>
          <button mat-menu-item routerLink="/author/blogs">
            <mat-icon>article</mat-icon>
            <span>My Blogs</span>
          </button>
          <button mat-menu-item routerLink="/meetups">
            <mat-icon>group</mat-icon>
            <span>My Meetups</span>
          </button>
        </mat-menu>

        <!-- Dropdown: Browse -->
        <button mat-button [matMenuTriggerFor]="authorReviewMenu" class="nav-menu-button">
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
          <span>Browse</span>
          <mat-icon>article</mat-icon>
        </button>
        <mat-menu #authorReviewMenu="matMenu" class="custom-menu">
          <button mat-menu-item routerLink="/blogs">
            <mat-icon>article</mat-icon>
            <span>Blogs</span>
          </button>
        </mat-menu>

        <!-- Dropdown: Settings -->
        <button mat-button [matMenuTriggerFor]="authorSettingsMenu" class="nav-menu-button">
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
          <span>Settings</span>
          <mat-icon>settings</mat-icon>
        </button>
        <mat-menu #authorSettingsMenu="matMenu" class="custom-menu">
          <button mat-menu-item routerLink="/author/tour-problems">
            <mat-icon>report_problem</mat-icon>
            <span>Tour Problems</span>
          </button>
          <button mat-menu-item routerLink="/profile">
            <mat-icon>account_circle</mat-icon>
            <span>My Profile</span>
          </button>
          <button mat-menu-item routerLink="/author/app-rating">
            <mat-icon>star</mat-icon>
            <span>Rate App</span>
          </button>
        </mat-menu>
      </ng-container>

      <!-- Tourist Dropdowns -->
      <ng-container *ngIf="user && user.role === 'tourist'">
        <!-- Dropdown: Tours -->
        <button mat-button [matMenuTriggerFor]="touristToursMenu" class="nav-menu-button">
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
          <span>Tours</span>
          <mat-icon>map</mat-icon>
        </button>
        <mat-menu #touristToursMenu="matMenu" class="custom-menu">
          <button mat-menu-item routerLink="/tour-execution/active">
            <mat-icon>play_circle</mat-icon>
            <span>Active Tour</span>
          </button>
          <button mat-menu-item routerLink="/tourist/tours">
            <mat-icon>shopping_bag</mat-icon>
            <span>Tours Shop</span>
          </button>
          <button mat-menu-item routerLink="/tourist/bundles">
            <mat-icon>inventory_2</mat-icon>
            <span>Tour Bundles Shop</span>
          </button>
          <button mat-menu-item routerLink="/tourist/my-tours">
            <mat-icon>list</mat-icon>
            <span>Purchased Tours</span>
          </button>
          <button mat-menu-item routerLink="/tourist/tour-history">
            <mat-icon>history</mat-icon>
            <span>Tour History</span>
          </button>
        </mat-menu>

        <!-- Dropdown: My Activity -->
        <button mat-button [matMenuTriggerFor]="touristActivityMenu" class="nav-menu-button">
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
          <span>My Activity</span>
          <mat-icon>local_activity</mat-icon>
        </button>
        <mat-menu #touristActivityMenu="matMenu" class="custom-menu">
          <button mat-menu-item routerLink="/tourist/my-reviews">
            <mat-icon>rate_review</mat-icon>
            <span>Reviews</span>
          </button>
          <button mat-menu-item routerLink="/tourist/diaries">
            <mat-icon>menu_book</mat-icon>
            <span>Diaries</span>
          </button>
          <button mat-menu-item routerLink="/my-clubs">
            <mat-icon>groups</mat-icon>
            <span>My Clubs</span>
          </button>
          <button mat-menu-item routerLink="/tourist/blogs">
            <mat-icon>article</mat-icon>
            <span>My Blogs</span>
          </button>
          <button mat-menu-item routerLink="/tour-execution/tour-problems">
            <mat-icon>report_problem</mat-icon>
            <span>Problems</span>
          </button>
        </mat-menu>

        <!-- Dropdown: Explore -->
        <button mat-button [matMenuTriggerFor]="touristExploreMenu" class="nav-menu-button">
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
          <span>Explore</span>
          <mat-icon>explore</mat-icon>
        </button>
        <mat-menu #touristExploreMenu="matMenu" class="custom-menu">
          <button mat-menu-item (click)="goToTopAuthors()">
            <mat-icon>person</mat-icon>
            <span>Top Authors</span>
          </button>
          <button mat-menu-item routerLink="/tourist/encounters">
            <mat-icon>stars</mat-icon>
            <span>Encounters</span>
          </button>
          <button mat-menu-item routerLink="/tourist/map">
            <mat-icon>map</mat-icon>
            <span>Map</span>
          </button>
        </mat-menu>

        <!-- Dropdown: Social -->
        <button mat-button [matMenuTriggerFor]="touristSocialMenu" class="nav-menu-button">
          <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
          <span>Social</span>
          <mat-icon>people</mat-icon>
        </button>
        <mat-menu #touristSocialMenu="matMenu" class="custom-menu">
          <button mat-menu-item routerLink="/blogs">
            <mat-icon>article</mat-icon>
            <span>Blogs</span>
          </button>
          <button mat-menu-item routerLink="/clubs">
            <mat-icon>groups</mat-icon>
            <span>Clubs</span>
          </button>
          <button mat-menu-item routerLink="/meetups" 
                  [disabled]="touristStats && touristStats.level < 2"
                  [matTooltip]="touristStats && touristStats.level < 2 ? '🔒 Unlocked at Bronze rank (Level 2+)' : ''">
            <mat-icon>event</mat-icon>
            <span>Meetups</span>
            <mat-icon *ngIf="touristStats && touristStats.level < 2" class="lock-icon">lock</mat-icon>
          </button>
        </mat-menu>
      </ng-container>
      </div>
    </div>

    <!-- Right Side Buttons -->
    <div class="navbar-right">
      <!-- My Cart Button (only for tourists) -->
      <div *ngIf="user && user.role === 'tourist'" class="cart-badge-container">
        <button mat-icon-button class="cart-button" (click)="toggleCartDropdown()">
          <mat-icon class="cart-icon">shopping_cart</mat-icon>
          <span *ngIf="cartItemsCount > 0" class="cart-badge">{{ cartItemsCount > 99 ? '99+' : cartItemsCount }}</span>
        </button>
        
        <div *ngIf="isCartDropdownOpen" class="cart-dropdown-overlay" (click)="closeCartDropdown()"></div>
        <xp-cart-dropdown 
          *ngIf="isCartDropdownOpen"
          (closeDropdown)="closeCartDropdown()">
        </xp-cart-dropdown>
      </div>

      <xp-notification-badge *ngIf="user && user.username !== ''" (dropdownOpened)="onNotificationDropdownOpened()"></xp-notification-badge>

      <!-- Tourist Level & Rank Badge (only for tourists) -->
      <button *ngIf="user && user.role === 'tourist' && touristStats" 
              class="level-rank-button" 
              (click)="openLevelDialog()" 
              [style.background]="rankConfig?.gradient"
              matTooltip="Click to view your progress">
        <mat-icon class="level-icon">military_tech</mat-icon>
        <div class="level-rank-info">
          <span class="rank-name">{{ touristStats.rank }}</span>
          <span class="level-text">Level {{ touristStats.level }}</span>
        </div>
        <span class="rank-emoji">{{ rankConfig?.icon }}</span>
      </button>

      <!-- Home Button (when not authenticated) -->
      <button *ngIf="!user || user.username === ''" mat-flat-button class="btn-home" routerLink="/home">
        <img src="assets/icons/home.png" alt="Home" class="btn-icon-img">
        <span>Home</span>
      </button>

      <!-- Login Button (when not authenticated) -->
      <button *ngIf="!user || user.username === ''" mat-flat-button class="btn-login" routerLink="/login">
        <img src="assets/icons/user.png" alt="Login" class="btn-icon-img">
        <span>Login</span>
      </button>

      <!-- Profile Picture (when authenticated) -->
      <a *ngIf="user && user.username !== ''" routerLink="/profile" class="profile-picture-link">
        <div class="profile-picture-container">
          <img [src]="profilePictureUrl || 'https://ionicframework.com/docs/img/demos/avatar.svg'" 
               (error)="onImageError($event)"
               alt="Profile" 
               class="profile-picture">
          <span class="profile-label">My Profile</span>
        </div>
      </a>

      <!-- Logout Button (when authenticated) -->
      <button *ngIf="user && user.username !== ''" mat-icon-button class="btn-logout-icon" (click)="onLogout()" matTooltip="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </div>
</mat-toolbar>
