<div class="comments-wrapper">

  <h3>Comments</h3>

  <div *ngIf="loading" class="text-center">
    Loading comments...
  </div>

  <div *ngIf="!loading && comments.length === 0" class="text-muted">
    No comments yet. Be the first to comment.
  </div>

  <div *ngFor="let c of comments" class="comment-card">
    <div class="comment-header">
      User #{{ c.authorId }} · {{ c.createdAt | date:'short' }}
    </div>
    <div class="comment-text">
      {{ c.text }}
    </div>

    <button
      class="btn btn-outline-light btn-sm delete-btn"
      (click)="deleteComment(c.id)">
      Delete
    </button>
  </div>

  <div class="comment-form">
    <textarea
      [(ngModel)]="newComment"
      placeholder="Write a comment...">
    </textarea>

    <button class="btn btn-primary" (click)="addComment()">
      Post Comment
    </button>
  </div>

</div>
