<div class="comment-list">
  <h3>Comments</h3>
  
  <div *ngFor="let comment of comments">
    <div class="comment">
      <p>{{ comment.text }} <span *ngIf="comment.editedAt">(edited)</span></p>
      <small>{{ comment.createdAt | date:'short' }}</small>
      
      <!-- Display edit/delete buttons if it's the user's comment -->
      <div *ngIf="comment.authorId === userId">
        <button (click)="editComment(comment.id, comment.text)">Edit</button>
        <button (click)="deleteComment(comment.id)">Delete</button>
      </div>
    </div>
  </div>

  <div class="comment-form">
    <textarea [(ngModel)]="newComment" placeholder="Add a comment"></textarea>
    <button (click)="addComment()">Post Comment</button>
  </div>
</div>
