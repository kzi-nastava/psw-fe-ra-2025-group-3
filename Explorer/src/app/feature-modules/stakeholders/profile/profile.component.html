<div class="profile-container">
    <form [formGroup]="profileForm" (ngSubmit)="saveChanges()">
      
      <div class="edit-toggle">
        <button *ngIf="!isEditing" type="button" mat-raised-button color="primary" (click)="toggleEdit()">
          Edit Profile
        </button>
        <button *ngIf="isEditing" type="button" mat-raised-button (click)="toggleEdit()">
          Cancel
        </button>
      </div>
  
      <mat-form-field appearance="fill">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>
  
      <mat-form-field appearance="fill">
        <mat-label>Surname</mat-label>
        <input matInput formControlName="surname">
      </mat-form-field>
  
      <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
      </mat-form-field>
  
      <mat-form-field appearance="fill">
        <mat-label>Profile Picture URL (optional)</mat-label>
        <input matInput formControlName="profilePictureUrl">
      </mat-form-field>
  
      <mat-form-field appearance="fill">
        <mat-label>Biography (optional)</mat-label>
        <textarea matInput formControlName="biography" rows="4"></textarea>
      </mat-form-field>
  
      <mat-form-field appearance="fill">
        <mat-label>Quote (optional)</mat-label>
        <input matInput formControlName="quote">
      </mat-form-field>
  
      <div *ngIf="isEditing" class="save-button">
        <button mat-raised-button color="primary" type="submit" [disabled]="profileForm.invalid">
          Save Changes
        </button>
      </div>
  
    </form>
  </div>
