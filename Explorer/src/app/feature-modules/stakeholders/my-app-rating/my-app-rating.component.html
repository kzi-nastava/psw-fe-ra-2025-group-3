<div id="my-rating">
  <p>Rate application</p>
  <hr>

  <form [formGroup]="form" (ngSubmit)="onSave()">

    <!-- ⭐ STAR RATING -->
    <div class="form-row">
      <label>Rating (1–5)</label>

      <div class="stars">
        <span
          *ngFor="let v of stars"
          class="star"
          [class.selected]="v <= form.get('rating')?.value"
          (click)="setRating(v)"
        >
          ★
        </span>
      </div>

      <div class="current-rating" *ngIf="form.get('rating')?.value">
        {{ form.get('rating')?.value }}/5
      </div>

      <div class="error" *ngIf="form.get('rating')?.touched && form.get('rating')?.invalid">
        Rating is required and must be between 1 and 5.
      </div>
    </div>

    <!-- COMMENT -->
    <div class="form-row">
      <label for="comment">Comment (optional)</label>
      <textarea id="comment" rows="4" formControlName="comment"></textarea>

      <div class="error" *ngIf="form.get('comment')?.hasError('maxlength')">
        Comment cannot be longer than 1000 characters.
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="buttons">
      <button mat-raised-button color="primary" type="submit">
        {{ existingRating ? 'Update rating' : 'Create rating' }}
      </button>

      <button
        *ngIf="existingRating"
        mat-raised-button
        color="warn"
        type="button"
        (click)="onDelete()">
        Delete rating
      </button>
    </div>

    <!-- METADATA -->
    <div class="meta" *ngIf="existingRating">
      <p>Created at: {{ existingRating.createdAt | date:'short' }}</p>
      <p *ngIf="existingRating.updatedAt">
        Last updated: {{ existingRating.updatedAt | date:'short' }}
      </p>
    </div>

  </form>
</div>
