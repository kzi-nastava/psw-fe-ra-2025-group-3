<!-- Profile Layout with Sidebar -->
<div class="profile-layout">
  <xp-profile-sidebar></xp-profile-sidebar>

  <!-- Main Content Area -->
  <div class="profile-content">
    <div class="container py-8">

      <div class="card">
    <!-- Header -->
    <div class="flex-between mb-6">
      <h2>My equipment</h2>
      <div class="badge badge-primary">
        {{ ownedEquipmentCount }} {{ ownedEquipmentCount === 1 ? 'item' : 'items' }}
      </div>
    </div>

    <!-- Notifikacije -->
    <div *ngIf="successMessage" class="notification success mb-4">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="notification error mb-4">
      {{ errorMessage }}
    </div>

    <!-- Tabovi -->
    <mat-tab-group [(selectedIndex)]="selectedTabIndex" class="mt-4">
      
      <!-- Tab: Sva oprema -->
      <mat-tab label="All equipment">
        <div class="equipment-list mt-6">
          <table class="equipment-table">
            <thead>
              <tr>
                <th style="width: 50px;"></th>
                <th>Title</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let eq of allEquipment" 
                  [class.owned-row]="eq.isOwnedByTourist">
                <td>
                  <mat-checkbox 
                    [checked]="eq.isOwnedByTourist"
                    (change)="onCheckboxChange(eq, $event)">
                  </mat-checkbox>
                </td>
                <td class="font-medium">{{ eq.name }}</td>
                <td class="text-muted">{{ eq.description }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </mat-tab>

      <!-- Tab: Moja oprema -->
      <mat-tab label="My equipment">
        <div class="equipment-list mt-6">
          <div *ngIf="myEquipment.length === 0" class="empty-state">
            <p class="text-muted">You don't have any equipment</p>
          </div>

          <table *ngIf="myEquipment.length > 0" class="equipment-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Description</th>
                <th style="width: 150px;"></th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let eq of myEquipment">
                <td class="font-medium">{{ eq.name }}</td>
                <td class="text-muted">{{ eq.description }}</td>
                <td>
                  <button 
                    class="btn-delete"
                    (click)="onRemoveFromMyEquipment(eq.id)" 
                    mat-raised-button
                    color="warn">
                    Remove
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </mat-tab>

    </mat-tab-group>
  </div>
    </div>
  </div>
</div>
