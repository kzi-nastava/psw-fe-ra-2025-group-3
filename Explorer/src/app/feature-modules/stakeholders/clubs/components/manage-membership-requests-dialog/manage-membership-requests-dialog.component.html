<div class="dialog-wrapper">
  <div class="dialog-header">
    <h2>Pending Membership Requests</h2>
    <button mat-icon-button (click)="close()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="requests-list" *ngIf="requests.length > 0; else emptyTpl">
    <div class="request-card" *ngFor="let req of requests">
      <div class="request-info">
        <mat-icon color="primary">person_add</mat-icon>
        <div>
          <span class="req-name">{{ req.username }}</span>
          <span class="req-email">{{ req.email }}</span>
        </div>
      </div>

      <div class="request-actions">
        <button mat-icon-button color="primary" (click)="respond(req.id, true)" matTooltip="Accept">
          <mat-icon>check_circle</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="respond(req.id, false)" matTooltip="Reject">
          <mat-icon>cancel</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <ng-template #emptyTpl>
    <div class="empty-state">
      <mat-icon>group_off</mat-icon>
      <p>No pending requests.</p>
    </div>
  </ng-template>
</div>
