<div class="my-clubs-container">

  <div class="header">
    <h1>My Clubs</h1>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      Create Club
    </button>
  </div>

  <div *ngIf="isLoading" class="loading-container">
    <p>Loading clubs...</p>
  </div>

  <div *ngIf="!isLoading && clubs.length === 0" class="empty-state">
    <h2>No clubs created</h2>
    <p>You haven’t created any clubs yet.</p>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      Create Club
    </button>
  </div>

  <div *ngIf="!isLoading && clubs.length > 0" class="clubs-grid">
    <div *ngFor="let club of clubs" class="club-card">

      <div class="club-header" [routerLink]="['/clubs', club.id]">
        <div class="club-avatar" *ngIf="getClubImageUrl(club)">
          <img [src]="getClubImageUrl(club)" alt="Club image" />
        </div>
        <h3>{{ club.name }}</h3>
      </div>

      <div class="club-content">
        <p>
          {{ club.description | slice:0:120 }}{{ club.description.length > 120 ? '...' : '' }}
        </p>
      </div>

      <div class="club-actions">
        <button mat-button class="edit-btn" (click)="openEditDialog(club)">
          Edit
        </button>
        <button mat-button class="delete-btn" (click)="deleteClub(club)">
          Delete
        </button>
      </div>

    </div>
  </div>

  <mat-paginator
    *ngIf="!isLoading && totalCount > pageSize"
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageIndex]="page - 1"
    [pageSizeOptions]="[6, 12, 24]"
    (page)="onPageChange($event)">
  </mat-paginator>

</div>
