<div class="club-list-container">

  <div class="header">
    <h1>Clubs</h1>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      Create Club
    </button>
  </div>

  <div *ngIf="isLoading" class="loading-container">
    <p>Loading clubs...</p>
  </div>

  <div *ngIf="!isLoading && clubs.length === 0" class="empty-state">
    <h2>No clubs available</h2>
    <p>Create the first club to gather people with similar interests.</p>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      Create Club
    </button>
  </div>

  <div *ngIf="!isLoading && clubs.length > 0" class="clubs-grid">
    <div
      *ngFor="let club of clubs"
      class="club-card"
      [routerLink]="['/clubs', club.id]">

      <div class="club-header">
        <div class="club-avatar" *ngIf="getClubImageUrl(club)">
          <img [src]="getClubImageUrl(club)" alt="Club image" />
        </div>
    </div>
        <mat-card-title>{{ club.name }}</mat-card-title>
        <mat-card-subtitle>
          {{ club.description | slice:0:80 }}{{ club.description.length > 80 ? '...' : '' }}
        </mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-actions align="end" class="club-actions">
        <button mat-stroked-button color="primary" 
                *ngIf="user && !isMember(club) && !isOwner(club)" 
                (click)="onJoinClub(club.id); $event.stopPropagation()">
          Join Club
        </button>
        <span *ngIf="isMember(club)" class="member-badge">Member</span>
        <span *ngIf="isOwner(club)" class="owner-badge">Owner</span>
      </mat-card-actions>
    </mat-card>
  </div>

  <mat-paginator
    *ngIf="!isLoading && totalCount > pageSize"
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageIndex]="page - 1"
    [pageSizeOptions]="[6, 12, 24]"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
