<div class="meetup-details-container">
  <button mat-button color="primary" class="back-button" (click)="goBack()">
    ← Back to Meetups
  </button>

  <div *ngIf="isLoading" class="loading-container">
    <p>Loading meetup details...</p>
  </div>

  <div *ngIf="!isLoading && meetup" class="meetup-details">
    <h1>{{ meetup.title }}</h1>
    
    <div class="meetup-info">
      <div class="info-item">
        <strong>Date & Time:</strong>
        <p>{{ meetup.dateTime | date:'full' }}</p>
      </div>

      <div class="info-item">
        <strong>Address:</strong>
        <p>{{ meetup.address }}</p>
      </div>
    </div>

    <div class="map-section">
        <xp-map 
            [center]="[meetup.latitude, meetup.longitude]" 
            [points]="mapPoints" 
            [zoom]="15" 
            [mode]="'object-view'">
        </xp-map>
    </div>

    <div class="related-tour-box mb-8 p-6" *ngIf="meetup.tourId && userRole === 'tourist'">
        <div class="flex-between">
            <div>
                <h3 class="m-0 text-white">Part of a Tour</h3>
                <p class="text-white m-0" style="opacity: 0.9;">This event is organized for a specific tour.</p>
            </div>
            <button class="btn btn-outline-light btn-lg" (click)="goToRelatedTour()">
                View Tour Details &rarr;
            </button>
        </div>
    </div>

    <div class="description-section">
      <h2>Description</h2>
      <div class="description-content">
        <markdown [data]="meetup.description"></markdown>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && !meetup" class="error-state">
    <h2>Meetup not found</h2>
    <p>The meetup you're looking for doesn't exist.</p>
  </div>
</div>
