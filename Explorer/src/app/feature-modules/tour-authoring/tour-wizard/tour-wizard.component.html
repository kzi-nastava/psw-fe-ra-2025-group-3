<div class="wizard">
  <div class="header">
    <h2>Tour wizard</h2>
    <div class="actions">
      <button mat-stroked-button (click)="cancel()">Cancel</button>
    </div>
  </div>

  <mat-tab-group
    [(selectedIndex)]="selectedIndex"
    class="tabs"
    (selectedTabChange)="onTabChange($event)"
  >
    <mat-tab label="Basic information">
      <div class="step">
        <app-tour-form
          [mode]="data.mode"
          [tour]="data.tour"
          [embedded]="true"
          (saved)="onTourFormSaved($event)"
          (cancelled)="cancel()"
        ></app-tour-form>
      </div>
    </mat-tab>

    <mat-tab label="Key points">
      <div class="step">
        <xp-key-point-page
          *ngIf="isOnKeyPoints && tourId as id"
          [currentTourId]="id"
        ></xp-key-point-page>

        <div *ngIf="isOnKeyPoints && !tourId" class="empty-state">
          Please save the tour first in order to add key points.
        </div>
      </div>
    </mat-tab>
  </mat-tab-group>

  <div class="footer">
    <button mat-stroked-button (click)="back()" [disabled]="isOnBasics">
      Back
    </button>

    <button
      mat-raised-button
      *ngIf="isOnBasics"
      (click)="goToKeyPoints()"
      [disabled]="!canOpenKeyPoints && data.mode !== 'edit'"
    >
      Next
    </button>

    <button mat-raised-button *ngIf="isOnKeyPoints" (click)="finish()">
      Finish
    </button>
  </div>
</div>
