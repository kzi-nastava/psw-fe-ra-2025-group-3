<div class="tour-list-container">
  <div class="header">
    <h1>My Tours</h1>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Create New Tour
    </button>
  </div>

  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!isLoading && tours.length === 0" class="empty-state">
    <mat-icon>explore_off</mat-icon>
    <h2>No tours created yet</h2>
    <p>Click the "Create New Tour" button to add your first tour.</p>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      Create First Tour
    </button>
  </div>

  <div *ngIf="!isLoading && tours.length > 0" class="tours-grid">
    <mat-card *ngFor="let tour of displayedTours" class="tour-card">
      <mat-card-header>
        <mat-card-title>{{ tour.name }}</mat-card-title>
        <mat-card-subtitle>
          <span class="status-badge" [ngClass]="getStatusClass(tour.status)">
            {{ getStatusLabel(tour.status) }}
          </span>
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p class="description">{{ tour.description }}</p>
        
        <div class="tour-details">
          <div class="detail-item">
            <mat-icon>terrain</mat-icon>
            <span>{{ getDifficultyLabel(tour.difficulty) }}</span>
          </div>
          <div class="detail-item">
            <mat-icon>attach_money</mat-icon>
            <span>{{ tour.price | number:'1.2-2' }} RSD</span>
          </div>
        </div>

        <div class="tags" *ngIf="tour.tags && tour.tags.length > 0">
          <mat-chip-set>
            <mat-chip *ngFor="let tag of tour.tags">{{ tag }}</mat-chip>
          </mat-chip-set>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button color="primary" (click)="openEditDialog(tour)">
          <mat-icon>edit</mat-icon>
          Edit
        </button>
        <button 
          mat-button 
          color="warn" 
          (click)="deleteTour(tour)"
          [disabled]="!canDelete(tour)">
          <mat-icon>delete</mat-icon>
          Delete
        </button>
        <button 
          mat-button 
          color="accent" 
          (click)="publishTour(tour)"
          *ngIf="canPublish(tour)">
          <mat-icon>publish</mat-icon>
          Publish
        </button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div *ngIf="hasMoreTours()" class="show-more-container">
    <button mat-raised-button (click)="showMore()">
      Show More
    </button>
  </div>
</div>
