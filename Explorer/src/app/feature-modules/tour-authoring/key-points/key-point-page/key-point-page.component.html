<div class="kp-container">

  <div class="kp-main">
    <div class="kp-map">
      <xp-map
        [mode]="'route-view'"
        [waypoints]="testPoints"
        (pointSelected)="onPointSelected($event)">
      </xp-map>

      <p *ngIf="selectedPoint" class="kp-selected">
        Izabrana tačka:
        {{ selectedPoint.lat }}, {{ selectedPoint.lng }}
      </p>
    </div>

    <div class="kp-side">
      <button mat-raised-button color="primary">
        Dodaj ključnu tačku
      </button>

      <!-- OVDE sada koristimo list komponentu -->
      <xp-key-point-list [keyPoints]="keyPoints"></xp-key-point-list>
    </div>
  </div>

  <div class="kp-form">
    <xp-key-point-form
      [isEditMode]="false"
      (save)="onKeyPointSave($event)"
      (cancel)="onKeyPointCancel()">
    </xp-key-point-form>
  </div>

</div>
