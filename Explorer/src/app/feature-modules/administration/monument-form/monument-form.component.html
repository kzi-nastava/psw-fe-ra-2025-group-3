<h2 mat-dialog-title>
  {{ isEditMode ? 'Edit Monument' : 'Create New Monument' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="monumentForm" class="monument-form">

    <!-- Name -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Enter name">
      <mat-icon matPrefix>location_city</mat-icon>
      <mat-error *ngIf="monumentForm.get('name')?.invalid">
        {{ getErrorMessage('name') }}
      </mat-error>
    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        formControlName="description"
        cdkTextareaAutosize
        cdkAutosizeMinRows="2"
        cdkAutosizeMaxRows="5"
        placeholder="Enter description">
      </textarea>
      <mat-icon matPrefix>description</mat-icon>
      <mat-error *ngIf="monumentForm.get('description')?.invalid">
        {{ getErrorMessage('description') }}
      </mat-error>
    </mat-form-field>

    <!-- Year -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Year</mat-label>
      <input matInput type="number" formControlName="year" placeholder="Enter year">
      <mat-icon matPrefix>event</mat-icon>
      <mat-error *ngIf="monumentForm.get('year')?.invalid">
        {{ getErrorMessage('year') }}
      </mat-error>
    </mat-form-field>

    
    <div class="full-width">
  <mat-label>Location</mat-label>

  <!-- [mode]="'edit-object'" vvvv -->
  <xp-map
  mode="edit-object"
  [points]="mapPoints"
  (pointSelected)="onPointSelected($event)">
</xp-map>

  <div class="coords-preview">
    Selected: {{ monumentForm.value.latitude }},
               {{ monumentForm.value.longitude }}
  </div>
</div>


  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button
    mat-raised-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="monumentForm.invalid">
    {{ isEditMode ? 'Save Changes' : 'Create Monument' }}
  </button>
</mat-dialog-actions>
