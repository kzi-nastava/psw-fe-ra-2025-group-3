<form [formGroup]="equipmentForm" class="styled-form">
  
  <div class="form-content">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Equipment Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Hiking Boots">
      <mat-icon matPrefix>badge</mat-icon>
      <mat-error *ngIf="equipmentForm.get('name')?.invalid">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput 
                formControlName="description" 
                cdkTextareaAutosize 
                cdkAutosizeMinRows="4" 
                cdkAutosizeMaxRows="8"
                placeholder="Describe the item details..."></textarea>
      <mat-icon matPrefix>description</mat-icon>
    </mat-form-field>

  </div>

  <div class="form-actions">
    <button 
      mat-raised-button 
      class="submit-btn"
      type="button"
      [disabled]="equipmentForm.invalid"
      (click)="shouldEdit ? updateEquipment() : addEquipment()">
      <mat-icon>{{ shouldEdit ? 'save' : 'add_circle' }}</mat-icon>
      {{ shouldEdit ? 'Save Changes' : 'Create Item' }}
    </button>
  </div>

</form>
