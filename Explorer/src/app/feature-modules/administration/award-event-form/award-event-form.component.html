<mat-card>
    <mat-card-header>
        <mat-card-title>{{ shouldEdit ? 'Izmeni Dodelu Nagrada' : 'Kreiraj Dodelu Nagrada' }}</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
        <form [formGroup]="awardEventForm" (ngSubmit)="addAwardEvent()">
            
            <mat-form-field appearance="fill">
                <mat-label>Naziv</mat-label>
                <input matInput formControlName="name">
                <mat-error *ngIf="awardEventForm.get('name')?.errors?.['required']">Naziv je obavezan.</mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>Opis</mat-label>
                <textarea matInput formControlName="description"></textarea>
                <mat-error *ngIf="awardEventForm.get('description')?.errors?.['required']">Opis je obavezan.</mat-error>
            </mat-form-field>
            
            <mat-form-field appearance="fill">
                <mat-label>Godina Dodele</mat-label>
                <input matInput type="number" formControlName="year">
                <mat-error *ngIf="awardEventForm.get('year')?.errors?.['required']">Godina je obavezna.</mat-error>
                <mat-error *ngIf="awardEventForm.get('year')?.errors?.['min'] || awardEventForm.get('year')?.errors?.['max']">Godina mora biti realna.</mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>Početak Glasanja</mat-label>
                <input matInput [matDatepicker]="pickerStart" formControlName="votingStartDate">
                <mat-datepicker-toggle matSuffix [for]="pickerStart"></mat-datepicker-toggle>
                <mat-datepicker #pickerStart></mat-datepicker>
                <mat-error *ngIf="awardEventForm.get('votingStartDate')?.errors?.['required']">Datum je obavezan.</mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>Kraj Glasanja</mat-label>
                <input matInput [matDatepicker]="pickerEnd" formControlName="votingEndDate">
                <mat-datepicker-toggle matSuffix [for]="pickerEnd"></mat-datepicker-toggle>
                <mat-datepicker #pickerEnd></mat-datepicker>
                <mat-error *ngIf="awardEventForm.get('votingEndDate')?.errors?.['required']">Datum je obavezan.</mat-error>
            </mat-form-field>

            <button mat-raised-button color="primary" type="submit" [disabled]="!awardEventForm.valid">
                {{ shouldEdit ? 'Sačuvaj izmene' : 'Kreiraj dodelu' }}
            </button>
        </form>
    </mat-card-content>
</mat-card>
