<h2>Kreiraj novi objekat</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()">

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Naziv</mat-label>
    <input matInput formControlName="name">
    <mat-error *ngIf="form.get('name')?.invalid">Naziv je obavezan.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Latitude</mat-label>
    <input matInput type="number" formControlName="latitude">
    <mat-error *ngIf="form.get('latitude')?.invalid">Unesite validnu vrednost.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Longitude</mat-label>
    <input matInput type="number" formControlName="longitude">
    <mat-error *ngIf="form.get('longitude')?.invalid">Unesite validnu vrednost.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Kategorija</mat-label>
    <mat-select formControlName="category">
      <mat-option value="WC">WC</mat-option>
      <mat-option value="Restoran">Restoran</mat-option>
      <mat-option value="Parking">Parking</mat-option>
      <mat-option value="Ostalo">Ostalo</mat-option>
    </mat-select>
    <mat-error *ngIf="form.get('category')?.invalid">Odaberite kategoriju.</mat-error>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
    Sačuvaj
  </button>

</form>
