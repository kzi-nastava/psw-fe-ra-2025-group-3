<div class="container animate-fade-in-up">

  <div class="card form-card">

    <h2 class="mb-6">
      {{ isEditMode ? 'Edit Facility' : 'Create Facility' }}
      {{ isEditMode ? 'Edit facilty' : 'Add new facility' }}
    </h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">

      <!-- Facility Name -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Facility Name</mat-label>
        <mat-label>Title</mat-label>
        <input matInput formControlName="name">
        <mat-icon matPrefix>location_on</mat-icon>
        <input matInput formControlName="name">
      </mat-form-field>

      <!-- Map Location -->
      <div class="full-width" *ngIf="dataLoaded">
        <mat-label>Location</mat-label>

        <!-- [mode]="'edit-object'" vvvv -->
        <xp-map
          mode="edit-object"
          [points]="mapPoints"
          (pointSelected)="onPointSelected($event)">
        </xp-map>

        <div class="coords-preview">
          Selected:
          {{ form.value.latitude }},
          {{ form.value.longitude }}
        </div>
      </div>

      <!-- Category -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
          <mat-option [value]="0">WC</mat-option>
          <mat-option [value]="1">Restaurant</mat-option>
          <mat-option [value]="2">Parking</mat-option>
          <mat-option [value]="3">Other</mat-option>
        </mat-select>
        <mat-icon matPrefix>category</mat-icon>
        <mat-select formControlName="category">
          <mat-option value="0">WC</mat-option>
          <mat-option value="1">Restaurant</mat-option>
          <mat-option value="2">Parking</mat-option>
          <mat-option value="3">Other</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Button -->
      <button 
        mat-raised-button 
        color="primary" 
        class="submit-btn"
        type="submit">
        {{ isEditMode ? 'Save Changes' : 'Create Facility' }}
        {{ isEditMode ? 'Save changes' : 'Add facilty' }}
      </button>

    </form>

  </div>

</div>
