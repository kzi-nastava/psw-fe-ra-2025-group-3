<div class="account-list-container">

  <div class="header">
    <h1>Accounts</h1>
    <button mat-raised-button color="primary" (click)="openForm('create')">
      <mat-icon>add</mat-icon>
      Create New Account
    </button>
  </div>

  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!isLoading && accounts.length === 0" class="empty-state">
    <mat-icon>person_off</mat-icon>
    <h2>No accounts found</h2>
    <p>The system currently has no accounts listed.</p>
    <button mat-raised-button color="primary" (click)="openForm('create')">
      <mat-icon>add</mat-icon>
      Create First Account
    </button>
  </div>

  <div *ngIf="!isLoading && accounts.length > 0" class="accounts-grid">

    <mat-card *ngFor="let acc of displayedAccounts" class="account-card">

      <mat-card-header>
        <mat-card-title>{{ acc.username }}</mat-card-title>
        <mat-card-subtitle>
          <span class="status-badge" [ngClass]="getStatusClass(acc.status)">
            {{ acc.status }}
          </span>
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="account-details">
          <div class="detail-item">
            <mat-icon>email</mat-icon>
            <span>{{ acc.email }}</span>
          </div>

          <div class="detail-item">
            <mat-icon>verified_user</mat-icon>
            <span>{{ acc.role }}</span>
          </div>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button color="warn" (click)="block(acc)" [disabled]="acc.status === 'Blocked'">
          <mat-icon>block</mat-icon>
          Block
        </button>

        <button mat-button color="accent" (click)="unblock(acc)" [disabled]="acc.status === 'Active'">
          <mat-icon>lock_open</mat-icon>
          Unblock
        </button>
      </mat-card-actions>

    </mat-card>
  </div>

  <div *ngIf="hasMore()" class="show-more-container">
    <button mat-raised-button (click)="showMore()">Show More</button>
  </div>

</div>
