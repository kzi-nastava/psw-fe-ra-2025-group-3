<div class="container animate-fade-in-up">

  <div class="list-header flex-between mb-6">
    <h1>Facilities</h1>

    <button 
      class="btn btn-primary"
      routerLink="/administration/facilities/new">
      ➕ Add Facility
    </button>
  </div>

  <div *ngIf="loading" class="text-center">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!loading && facilities.length === 0" class="empty-box card text-center">
    <p>No facilities available.</p>
    <p>No facilities.</p>
  </div>

  <div *ngIf="facilities.length > 0" class="card">

    <table class="styled-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Title</th>
          <th>Category</th>
          <th>Latitude</th>
          <th>Longitude</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let f of facilities">
          <td>{{ f.name }}</td>
          <td>
            <span class="badge badge-primary">
              {{ getCategoryLabel(f.category) }}
            </span>
          </td>
          <td>{{ f.latitude }}</td>
          <td>{{ f.longitude }}</td>
          <td class="actions">

            <button class="btn btn-secondary btn-sm"
              [routerLink]="['/administration/facilities/edit', f.id]">
              ✏ Edit
            </button>

            <button class="btn btn-outline-light btn-sm delete-btn"
              (click)="deleteFacility(f.id)">
              🗑 Delete
            </button>

          </td>
        </tr>
      </tbody>
    </table>

  </div>

</div>
