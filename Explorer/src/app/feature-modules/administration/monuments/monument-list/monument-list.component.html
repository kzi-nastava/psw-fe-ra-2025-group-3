<div class="monument-list-container">

  <!-- HEADER -->
  <div class="header">
    <h1>Monuments</h1>
    <button
      mat-raised-button
      color="primary"
      class="add-monument-button"
      (click)="onAddClicked()">
      <mat-icon>add</mat-icon>
      Add Monument
    </button>
  </div>

  <!-- LOADING -->
  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>

  <!-- EMPTY STATE -->
  <div *ngIf="!isLoading && monuments.length === 0" class="empty-state">
    <mat-icon>location_off</mat-icon>
    <h2>No monuments found</h2>
    <p>The system currently has no monuments listed.</p>
    <button mat-raised-button color="primary" (click)="onAddClicked()">
      <mat-icon>add</mat-icon>
      Create First Monument
    </button>
  </div>

  <!-- GRID SA KARTICAMA -->
  <div *ngIf="!isLoading && monuments.length > 0" class="monuments-grid">

    <mat-card *ngFor="let m of monuments" class="monument-card">

      <mat-card-header>
        <mat-card-title>{{ m.name }}</mat-card-title>
        <mat-card-subtitle>
          <span class="status-badge"
                [ngClass]="m.status === 1 ? 'status-active' : 'status-inactive'">
            {{ m.status === 1 ? 'Active' : 'Inactive' }}
          </span>
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="monument-details">

          <div class="detail-item">
            <mat-icon>description</mat-icon>
            <span>{{ m.description }}</span>
          </div>

          <div class="detail-item">
            <mat-icon>event</mat-icon>
            <span>{{ m.year }}</span>
          </div>

          <div class="detail-item">
            <mat-icon>location_on</mat-icon>
            <span>{{ m.latitude }}, {{ m.longitude }}</span>
          </div>

        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button color="primary" (click)="onEditClicked(m)">
          <mat-icon>edit</mat-icon>
          Edit
        </button>

        <button mat-button color="warn" (click)="deleteMonument(m.id || 0)">
          <mat-icon>delete</mat-icon>
          Delete
        </button>
      </mat-card-actions>

    </mat-card>

  </div>

</div>
