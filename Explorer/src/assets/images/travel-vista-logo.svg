<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
   
    <radialGradient id="planetGlow">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#0891B2;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:0" />
    </radialGradient>
   
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#065F46;stop-opacity:1" />
    </linearGradient>
   
    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
   
    <!-- Paths for animation -->
    <path id="orbit1" d="M 250,250 m -110,0 a 110,110 0 1,1 220,0 a 110,110 0 1,1 -220,0" fill="none"/>
    <path id="orbit2" d="M 250,250 m -140,0 a 140,140 0 1,1 280,0 a 140,140 0 1,1 -280,0" fill="none"/>
  </defs>
 
  <!-- Outer glow ring -->
  <circle cx="250" cy="250" r="200" fill="url(#planetGlow)" opacity="0.3">
    <animate attributeName="r" values="200;210;200" dur="4s" repeatCount="indefinite"/>
  </circle>
 
  <!-- Main composition -->
  <g transform="translate(250, 250)">
   
    <!-- Rotating orbit rings -->
    <g opacity="0.2">
      <ellipse cx="0" cy="0" rx="130" ry="130" stroke="#06B6D4" stroke-width="1" fill="none" stroke-dasharray="8,8">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="0" rx="160" ry="160" stroke="#0891B2" stroke-width="1" fill="none" stroke-dasharray="6,6">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="25s" repeatCount="indefinite"/>
      </ellipse>
    </g>
   
    <!-- Central Earth/Globe -->
    <g filter="url(#glow)">
      <!-- Globe shadow -->
      <circle cx="3" cy="3" r="85" fill="#065F46" opacity="0.3"/>
     
      <!-- Main globe -->
      <circle cx="0" cy="0" r="85" fill="url(#oceanGradient)"/>
     
      <!-- Latitude/Longitude lines -->
      <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.3" fill="none">
        <ellipse cx="0" cy="0" rx="85" ry="30"/>
        <ellipse cx="0" cy="0" rx="85" ry="50"/>
        <ellipse cx="0" cy="0" rx="85" ry="70"/>
        <ellipse cx="0" cy="0" rx="30" ry="85"/>
        <ellipse cx="0" cy="0" rx="50" ry="85"/>
        <ellipse cx="0" cy="0" rx="70" ry="85"/>
      </g>
     
      <!-- Continents (simplified) -->
      <g fill="#0D9488" opacity="0.6">
        <!-- North America -->
        <path d="M -45,-40 Q -35,-50 -25,-45 L -15,-50 Q -5,-48 0,-40 Q 5,-35 0,-30 L -10,-25 Q -20,-28 -25,-35 Q -35,-38 -40,-35 Z"/>
       
        <!-- South America -->
        <path d="M -15,-20 Q -10,-15 -15,-5 L -20,10 Q -25,20 -20,25 Q -15,22 -10,15 L -8,5 Q -5,-10 -10,-18 Z"/>
       
        <!-- Europe/Africa -->
        <path d="M 15,-35 Q 25,-38 35,-30 L 40,-20 Q 45,-10 40,0 L 35,15 Q 30,25 35,35 Q 28,40 20,35 L 15,25 Q 10,15 15,5 L 20,-5 Q 18,-15 15,-25 Z"/>
       
        <!-- Asia -->
        <path d="M 40,-40 Q 55,-45 65,-35 L 70,-20 Q 75,-10 70,0 Q 65,10 60,5 L 50,0 Q 45,-10 48,-20 Z"/>
       
        <!-- Australia -->
        <path d="M 55,20 Q 65,18 70,25 Q 68,35 60,33 L 52,30 Q 50,25 55,20 Z"/>
      </g>
     
      <!-- Highlight shine -->
      <ellipse cx="-25" cy="-25" rx="30" ry="35" fill="#FFFFFF" opacity="0.15"/>
    </g>
   
    <!-- Mountain range with depth -->
    <g transform="translate(0, 100)">
      <!-- Back mountains -->
      <path d="M -100,30 L -70,-10 L -45,15 L -30,-5 L 0,25 L 20,10 L 45,-15 L 70,15 L 100,25 L 100,40 L -100,40 Z"
            fill="#065F46" opacity="0.4"/>
     
      <!-- Middle mountains -->
      <path d="M -100,35 L -60,0 L -30,25 L 0,-15 L 30,20 L 60,-5 L 100,30 L 100,40 L -100,40 Z"
            fill="url(#mountainGrad)" opacity="0.7"/>
     
      <!-- Front mountains -->
      <path d="M -100,40 L -70,15 L -40,35 L -10,5 L 20,30 L 50,10 L 80,35 L 100,40 Z"
            fill="#0D9488"/>
     
      <!-- Snow caps -->
      <path d="M -60,0 L -55,-3 L -50,5" fill="#FFFFFF" opacity="0.6"/>
      <path d="M 0,-15 L 5,-18 L 10,-10" fill="#FFFFFF" opacity="0.6"/>
      <path d="M 60,-5 L 65,-8 L 70,0" fill="#FFFFFF" opacity="0.6"/>
    </g>
   
  </g>
 
  <!-- Animated airplane -->
  <g id="airplane1">
    <g transform="scale(0.8)">
      <path d="M 0,-3 L 8,0 L 0,3 L -2,3 L -2,5 L -4,5 L -4,3 L -6,3 L -8,5 L -10,5 L -8,0 L -10,-5 L -8,-5 L -6,-3 L -4,-3 L -4,-5 L -2,-5 L -2,-3 Z"
            fill="#06B6D4" stroke="#FFFFFF" stroke-width="0.5"/>
      <circle cx="3" cy="0" r="1" fill="#FFFFFF" opacity="0.8"/>
    </g>
   
    <animateMotion dur="12s" repeatCount="indefinite">
      <mpath href="#orbit2"/>
    </animateMotion>
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>
  </g>
 
  <!-- Animated suitcase -->
  <g id="suitcase">
    <g transform="scale(1.2)">
      <!-- Suitcase shadow -->
      <rect x="-7" y="-8" width="14" height="13" rx="1" fill="#000000" opacity="0.2"/>
     
      <!-- Suitcase body -->
      <rect x="-8" y="-9" width="16" height="13" rx="1.5" fill="#0D9488" stroke="#065F46" stroke-width="1"/>
      <rect x="-7" y="-8" width="14" height="11" rx="1" fill="#06B6D4"/>
     
      <!-- Details -->
      <line x1="-6" y1="-6" x2="-6" y2="1" stroke="#0891B2" stroke-width="1"/>
      <line x1="0" y1="-6" x2="0" y2="1" stroke="#0891B2" stroke-width="1"/>
      <line x1="6" y1="-6" x2="6" y2="1" stroke="#0891B2" stroke-width="1"/>
      <rect x="-2" y="-1" width="4" height="2" rx="0.5" fill="#0891B2"/>
     
      <!-- Handle -->
      <path d="M -4,-9 Q -4,-12 -2,-12 L 2,-12 Q 4,-12 4,-9"
            stroke="#065F46" stroke-width="2" fill="none" stroke-linecap="round"/>
     
      <!-- Stickers -->
      <circle cx="-4" cy="-5" r="1.5" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="4" cy="-3" r="1.2" fill="#FFFFFF" opacity="0.4"/>
    </g>
   
    <animateMotion dur="10s" repeatCount="indefinite">
      <mpath href="#orbit1"/>
    </animateMotion>
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
  </g>
 
  <!-- Compass pin markers on globe area -->
  <g>
    <circle cx="200" cy="200" r="4" fill="#FF6B6B" opacity="0.8" stroke="#FFFFFF" stroke-width="1">
      <animate attributeName="r" values="4;5;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="230" r="4" fill="#FFA500" opacity="0.8" stroke="#FFFFFF" stroke-width="1">
      <animate attributeName="r" values="4;5;4" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="280" r="4" fill="#FFD700" opacity="0.8" stroke="#FFFFFF" stroke-width="1">
      <animate attributeName="r" values="4;5;4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
 
  <!-- Floating sparkles -->
  <g>
    <g opacity="0.6">
      <path d="M 120,140 L 122,145 L 127,147 L 122,149 L 120,154 L 118,149 L 113,147 L 118,145 Z" fill="#06B6D4">
        <animateTransform attributeName="transform" type="rotate" from="0 120 147" to="360 120 147" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.6">
      <path d="M 370,160 L 372,165 L 377,167 L 372,169 L 370,174 L 368,169 L 363,167 L 368,165 Z" fill="#0891B2">
        <animateTransform attributeName="transform" type="rotate" from="0 370 167" to="360 370 167" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.6">
      <path d="M 390,310 L 391,313 L 394,314 L 391,315 L 390,318 L 389,315 L 386,314 L 389,313 Z" fill="#06B6D4">
        <animateTransform attributeName="transform" type="rotate" from="0 390 314" to="360 390 314" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.6">
      <path d="M 110,300 L 111,303 L 114,304 L 111,305 L 110,308 L 109,305 L 106,304 L 109,303 Z" fill="#0891B2">
        <animateTransform attributeName="transform" type="rotate" from="0 110 304" to="360 110 304" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
 
  <!-- Text with gradient -->
  <defs>
    <linearGradient id="textGrad1">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
  </defs>
 
  <text x="250" y="410"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="52"
        font-weight="800"
        fill="url(#textGrad1)"
        text-anchor="middle"
        letter-spacing="4">
    TRAVEL
  </text>
 
  <text x="250" y="455"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="42"
        font-weight="300"
        fill="#0891B2"
        text-anchor="middle"
        letter-spacing="12"
        opacity="0.9">
    VISTA
  </text>
 
  <!-- Underline animation -->
  <line x1="180" y1="465" x2="320" y2="465" stroke="#06B6D4" stroke-width="2" opacity="0.5" stroke-linecap="round">
    <animate attributeName="x2" values="180;320;180" dur="3s" repeatCount="indefinite"/>
  </line>
 
  <!-- Bottom decorative dots -->
  <g>
    <circle cx="210" cy="415" r="3" fill="#06B6D4" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="415" r="3" fill="#06B6D4" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
 
</svg>
